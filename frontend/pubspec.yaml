name: smart_ai_expense_tracker
description: Smart AI Expense Tracker
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  font_awesome_flutter: ^10.9.1
  flutter_svg: ^2.2.1

  # State Management
  flutter_riverpod: ^2.6.1
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^16.1.0

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Database
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.0

  # Biometric
  local_auth: ^2.3.0

  # pdf
  pdf: ^3.11.0
  printing: ^5.13.4
  provider: ^6.1.2

  # Auth
  google_sign_in: ^6.2.2
  flutter_dotenv: ^5.2.1

  # Notifications & Deep Links
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  # UI
  google_fonts: ^6.3.0
  lottie: ^3.3.1
  flutter_slidable: ^4.0.1

  # Permissions
  permission_handler: ^12.0.1
  mobile_scanner: ^5.2.3
  google_mlkit_text_recognition: ^0.16.0
  image_picker: ^1.2.1
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#7B4DFF"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - .env